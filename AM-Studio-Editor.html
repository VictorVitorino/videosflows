<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A&amp;M Studio · Editor de Apresentações</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<!--
  A&M STUDIO — editor de apresentações em HTML (arquivo "core").
  Este arquivo nunca é alterado: "Salvar apresentação" gera um NOVO arquivo .html com seus slides,
  que abre em qualquer navegador e pode ser reaberto aqui (botão Abrir) para continuar editando.
-->
<style id="am-runtime-css">/* ===== AM Studio runtime (compartilhado entre editor e apresentação exportada) ===== */
.am-stage{position:relative;container-type:size;aspect-ratio:16/9;overflow:hidden;background:#fff;font-family:Inter,Roboto,Arial,sans-serif;color:#002A46;-webkit-font-smoothing:antialiased;isolation:isolate}
.am-stage *{box-sizing:border-box}
.am-bgimg{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
.am-el{position:absolute}
.am-rot,.am-fxw{position:relative;width:100%;height:100%}
.am-fxw>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.am-text{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible;word-break:break-word}
.am-tx{outline:none;min-height:1em}
.am-img{width:100%;height:100%;display:block}
/* entrada */
.am-stage.am-pre .am-el[data-in]{opacity:0}
.am-stage.am-in .am-el[data-in]{animation-duration:var(--t,700ms);animation-delay:var(--d,0ms);animation-timing-function:cubic-bezier(.22,.61,.36,1);animation-fill-mode:both}
.am-stage.am-in .am-el[data-in=fade]{animation-name:amFade}
.am-stage.am-in .am-el[data-in=rise]{animation-name:amRise}
.am-stage.am-in .am-el[data-in=left]{animation-name:amLeft}
.am-stage.am-in .am-el[data-in=right]{animation-name:amRight}
.am-stage.am-in .am-el[data-in=zoom]{animation-name:amZoom}
.am-stage.am-in .am-el[data-in=focus]{animation-name:amFocus}
.am-stage.am-in .am-el[data-in=wipe]{animation-name:amWipe;animation-timing-function:cubic-bezier(.65,0,.35,1)}
.am-stage.am-in .am-el[data-in=draw]{animation-name:amFade;animation-duration:.01ms}
.am-stage.am-in .am-el[data-in=draw] .am-ln{stroke-dasharray:1;animation:amDraw var(--t,900ms) cubic-bezier(.65,0,.35,1) var(--d,0ms) both}
.am-stage.am-in .am-el[data-in=draw] .am-head{animation:amFade .35s ease calc(var(--d,0ms) + var(--t,900ms) * .8) both}
@keyframes amFade{from{opacity:0}}
@keyframes amRise{from{opacity:0;transform:translateY(28px)}}
@keyframes amLeft{from{opacity:0;transform:translateX(-48px)}}
@keyframes amRight{from{opacity:0;transform:translateX(48px)}}
@keyframes amZoom{from{opacity:0;transform:scale(.82)}}
@keyframes amFocus{from{opacity:0;filter:blur(10px);transform:scale(1.04)}}
@keyframes amWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes amDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
/* efeitos contínuos */
.am-fxw[data-loop=pulse]{animation:amPulse 2.4s ease-in-out infinite}
.am-fxw[data-loop=float]{animation:amFloat 4.2s ease-in-out infinite}
.am-fxw[data-loop=glow]{animation:amGlow 2.8s ease-in-out infinite}
.am-fxw[data-loop=shimmer]{overflow:hidden}
.am-fxw[data-loop=shimmer]::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.38) 50%,transparent 62%);background-size:260% 100%;animation:amShim 3.4s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen;border-radius:inherit}
@keyframes amPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes amFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1cqh)}}
@keyframes amGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(247,140,22,0))}50%{filter:drop-shadow(0 0 1.4cqh rgba(247,140,22,.6))}}
@keyframes amShim{0%{background-position:130% 0}60%,100%{background-position:-30% 0}}
/* hover (só na apresentação) */
.am-play .am-fxw[data-hover]{transition:transform .35s cubic-bezier(.22,.61,.36,1),filter .35s}
.am-play .am-fxw[data-hover=lift]:hover{transform:translateY(-.9cqh);filter:drop-shadow(0 1.8cqh 2.4cqh rgba(0,30,50,.28))}
.am-play .am-fxw[data-hover=zoom]:hover{transform:scale(1.06)}
.am-play .am-fxw[data-hover=glow]:hover{filter:drop-shadow(0 0 1.8cqh rgba(247,140,22,.6))}
.am-play .am-rot:has(>.am-fxw[data-hover=tilt]){perspective:900px}
.am-play .am-fxw[data-hover=tilt]{transition:transform .15s ease-out;transform-style:preserve-3d}
.am-play .am-fxw[data-hover=tilt]::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
.am-play .am-fxw[data-hover=tilt]:hover::before{opacity:1}
/* ===== componentes de efeito ===== */
.fx{position:absolute;inset:0;overflow:hidden}
.fx-dark{background:linear-gradient(155deg,#0B3A63,#002A46 55%,#001E32);color:#fff}
.fx-light{background:#fff;color:#002A46;border:1px solid #DCE3EC}
.fx-ice{background:#EEF2F7;color:#002A46}
.fx-clear{background:transparent}
.fxc{display:flex;flex-direction:column;justify-content:center;padding:0 7%}
.fxc-lbl{font-family:'Roboto Condensed',Roboto,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.fxc-val{font-family:'JetBrains Mono',Roboto,monospace;font-weight:500;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.fx-dark .fxc-val{color:#fff}.fx-light .fxc-val,.fx-ice .fxc-val{color:#002A46}
.fxc-sub{font-weight:600;color:#F78C16}
.fxc-bar{display:block;margin-top:4%;height:3%;min-height:3px;border-radius:9px;background:rgba(127,150,180,.25);overflow:hidden}
.fxc-bar>i{display:block;height:100%;width:var(--w,70%);border-radius:inherit;background:linear-gradient(90deg,#7EA1C3,#F78C16);transform-origin:0 50%}
.am-in .fxc-bar>i{animation:amBar 1.4s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + 200ms) both}
@keyframes amBar{from{transform:scaleX(0)}}
.fxp{display:flex;flex-direction:column;justify-content:center;gap:6%;padding:0 6%}
.fxp-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.fxp-top b{font-family:'JetBrains Mono',monospace;font-weight:600}
.fxp-track{position:relative;height:16%;min-height:6px;border-radius:99px;background:rgba(127,150,180,.22)}
.fxp-fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,#4A6FA5,#002A46);transform-origin:0 50%}
.fx-dark .fxp-fill{background:linear-gradient(90deg,#7EA1C3,#F78C16)}
.fxp-tgt{position:absolute;top:-40%;bottom:-40%;width:2px;background:#F78C16}
.fxp-tgt::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:.75em;color:#F78C16;white-space:nowrap;margin-top:2px}
.am-in .fxp-fill{animation:amBar 1.4s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + 150ms) both}
.fxr-ring{transform:rotate(-90deg);transform-origin:50% 50%}
.am-in .fxr-arc{animation:amRing 1.6s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + 150ms) both}
@keyframes amRing{from{stroke-dashoffset:100}}
.am-in .fxb-bar{animation:amGrow .9s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + var(--i) * 110ms + 150ms) both}
.fxb-bar{transform-box:fill-box;transform-origin:50% 100%}
@keyframes amGrow{from{transform:scaleY(0)}}
.am-in .fxb-v{animation:amFade .4s ease calc(var(--d,0ms) + var(--i) * 110ms + 800ms) both}
.am-in .fxt-line{animation:amDraw 1.4s cubic-bezier(.65,0,.35,1) calc(var(--d,0ms) + 100ms) both}
.fxt-line{stroke-dasharray:1}
.am-in .fxt-node{animation:amPop .5s cubic-bezier(.34,1.56,.64,1) calc(var(--d,0ms) + 300ms + var(--i) * 260ms) both}
.fxt-node{transform-box:fill-box;transform-origin:center}
@keyframes amPop{from{opacity:0;transform:scale(0)}}
.am-in .fxt-lab{animation:amRise .6s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + 420ms + var(--i) * 260ms) both}
.fxt-lab{position:absolute;text-align:center;transform:translateX(-50%)}
.fxt-lab b{display:block;font-family:'Roboto Condensed',Roboto,sans-serif;font-weight:700;color:#F78C16}
.fxs{display:flex;align-items:stretch;gap:1.2%;padding:0}
.fxs-step{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8% 0 12%;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,12% 50%);background:#DCE5F0;color:#002A46;font-weight:600;line-height:1.15;transition:background .5s,color .5s}
.fxs-step:first-child{clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);padding-left:5%}
.fxs-step.on{background:#002A46;color:#fff}
.fxs-step.on:last-child,.fxs-step.hl{background:#F78C16;color:#fff}
.am-in .fxs-step{animation:amLeft .6s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + var(--i) * 160ms) both}
.fxbe{display:flex;align-items:center;gap:6%;overflow:visible}
.fxbe-dot{position:relative;flex:none;height:46%;aspect-ratio:1;border-radius:50%;background:#F78C16;box-shadow:0 0 0 .5cqh rgba(255,255,255,.9)}
.fxbe-dot::before,.fxbe-dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #F78C16;animation:amRingOut 2.4s ease-out infinite}
.fxbe-dot::after{animation-delay:1.2s}
@keyframes amRingOut{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.fxbe-txt b{display:block;font-family:'Roboto Condensed',Roboto,sans-serif;font-weight:700}
.fxh{border-radius:4%/7%;padding:6% 7%;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2cqh 4cqh rgba(0,20,40,.35)}
.fxh::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.10) 46%,rgba(163,184,214,.42) 50%,rgba(247,140,22,.30) 54%,transparent 60%);mix-blend-mode:screen;animation:amSweep 5s cubic-bezier(.65,0,.35,1) infinite;pointer-events:none}
@keyframes amSweep{0%,55%{transform:translateX(-70%)}100%{transform:translateX(70%)}}
.fxh-eye{font-family:'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#A3B8D6}
.fxh-tt{font-weight:700;letter-spacing:-.02em;line-height:1.05}
.fxh-tx{color:#C9D6E8;line-height:1.4}
.fxh-dot{position:absolute;right:7%;top:9%;width:3%;aspect-ratio:1;border-radius:50%;background:#F78C16;box-shadow:0 0 1.4cqh #F78C16}
.fxg{border-radius:5%/9%;padding:6% 7%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:6%;box-shadow:0 1.5cqh 3cqh rgba(0,20,40,.25)}
.fxg b{font-weight:700;line-height:1.1}
.fxhl{display:flex;flex-direction:column;justify-content:center;overflow:visible}
.fxhl-w{display:inline-block;white-space:pre}
.am-in .fxhl-w{animation:amRise .7s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + var(--i) * 90ms) both}
.fxhl-hl{color:#F78C16;position:relative}
.fxhl-hl::after{content:"";position:absolute;left:0;right:0;bottom:-.06em;height:.07em;background:#F78C16;transform-origin:0 50%}
.am-in .fxhl-hl::after{animation:amBar .7s cubic-bezier(.65,0,.35,1) calc(var(--d,0ms) + var(--n) * 90ms + 500ms) both}
.fxcd{border-radius:3%/6%;padding:7% 8%;display:flex;flex-direction:column;gap:5%}
.fxcd-acc{position:absolute;left:0;top:0;bottom:0;width:1.6%;background:#F78C16}
.fxcd-tag{font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#7EA1C3}
.fxcd-tt{font-weight:700;line-height:1.12}
.fxcd-tx{line-height:1.45;opacity:.85}
.fx-light.fxcd{box-shadow:0 .8cqh 2.4cqh rgba(0,42,70,.10)}
.fxq{display:flex;align-items:center;padding:0 5%;border-radius:1cqh}
.fxq i{font-style:italic;font-weight:600;line-height:1.35}
.fxq-bar{position:absolute;left:0;top:0;bottom:0;width:1%;background:#F78C16}
/* ===== player ===== */
.amp{position:fixed;inset:0;background:#00192b;display:flex;flex-direction:column;font-family:'Roboto Condensed',Roboto,Arial,sans-serif;color:#fff;z-index:50}
.amp-view{flex:1;display:grid;place-items:center;min-height:0;background:radial-gradient(ellipse at 50% 40%,#022844,#00172a 72%)}
.amp-deck{position:relative;width:min(100vw,calc((100vh - 52px) * 16 / 9));aspect-ratio:16/9;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.amp-slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s cubic-bezier(.22,.61,.36,1),visibility 0s .6s,transform .7s cubic-bezier(.22,.61,.36,1)}
.amp-slide.on{opacity:1;visibility:visible;transition:opacity .6s cubic-bezier(.22,.61,.36,1),visibility 0s,transform .7s cubic-bezier(.22,.61,.36,1);z-index:2}
.amp-slide[data-tr=slide]:not(.on){transform:translateX(4%)}
.amp-slide[data-tr=zoom]:not(.on){transform:scale(1.04)}
.amp-slide[data-tr=none]{transition:none}
.amp-slide>.am-stage{width:100%;height:100%;aspect-ratio:auto}
.amp-bar{height:52px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px;background:#001424;border-top:1px solid rgba(255,255,255,.08)}
.amp-brand{font-weight:700;letter-spacing:.14em;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amp-brand i{font-style:normal;color:#F78C16}
.amp-brand span{font-weight:400;letter-spacing:.02em;color:#7EA1C3;margin-left:12px}
.amp-c{display:flex;align-items:center;gap:10px}
.amp-b{height:34px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.amp-b:hover{border-color:#F78C16;background:rgba(247,140,22,.12)}
.amp-b[disabled]{opacity:.3;pointer-events:none}
.amp-pos{font-family:Roboto,sans-serif;letter-spacing:.12em;color:#7EA1C3;min-width:72px;text-align:center;font-size:14px}
.amp-pos b{color:#fff;font-weight:400}
.amp-r{display:flex;justify-content:flex-end;gap:8px}
.amp-prog{position:absolute;left:0;bottom:52px;height:2px;background:linear-gradient(90deg,#7EA1C3,#F78C16);transition:width .5s}
/* ===================== MODELOS ===================== */
@keyframes amAccent{0%,100%{box-shadow:0 0 0 0 rgba(247,140,22,.55);transform:scale(1)}50%{box-shadow:0 0 0 .55em rgba(247,140,22,0);transform:scale(1.12)}}
@keyframes amFlip{from{opacity:0;transform:perspective(900px) rotateY(-75deg)}}
@keyframes amCell{from{opacity:0;transform:scale(.55)}}
@keyframes amDropC{0%{opacity:0;transform:translate(-50%,-260%) scale(.6)}70%{opacity:1;transform:translate(-50%,-40%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes amPopC{from{opacity:0;transform:translate(-50%,-50%) scale(0)}}
@keyframes amScan{0%,100%{filter:none}6%{filter:brightness(1.3) saturate(1.2)}14%{filter:none}}
@keyframes amRingC{0%{box-shadow:0 0 0 0 rgba(247,140,22,.7)}100%{box-shadow:0 0 0 1.1em rgba(247,140,22,0)}}
@keyframes amHl{from{fill:#002A46}}
@keyframes amSeg{from{stroke-dasharray:0 100}}
@keyframes amFromL{from{left:0}}
@keyframes amW{from{width:var(--from,0%)}}
@keyframes amNeedle{from{transform:rotate(-90deg)}}
@keyframes amUp{from{transform:scaleY(0)}}
@keyframes amBeat{0%,100%{transform:scale(1);color:inherit}50%{transform:scale(1.1);color:#F78C16}}
.fx-panel{background:#fff;border-radius:1.2cqh;box-shadow:0 1.2cqh 3cqh rgba(0,20,40,.3)}
.fx-pin{position:absolute;inset:5%}
[data-e]{border-radius:3px}
.cy-active [data-g]{transition:opacity .45s,filter .45s,background .45s,color .45s,transform .45s}
.cy-active [data-g]:not(.cy-on){opacity:.3}
/* RACI */
.fxraci{display:grid;gap:.3em;color:#002A46;overflow:visible}
.raci-h{display:flex;align-items:flex-end;justify-content:center;text-align:center;font-family:'Roboto Condensed',Roboto,sans-serif;font-weight:700;padding-bottom:.35em;border-bottom:2px solid #002A46;line-height:1.1}
.raci-t{display:flex;align-items:center;padding:0 .7em;background:#F1F4F8;border-radius:.35em;font-weight:600;line-height:1.2}
.raci-c{display:flex;align-items:center;justify-content:center;background:#F8FAFC;border-radius:.35em}
.raci-b{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;font-family:'Roboto Condensed',Roboto,sans-serif;font-weight:700;font-style:normal;line-height:1;flex:none}
.b-R{background:#002A46;color:#fff}.b-A{background:#F78C16;color:#fff}.b-C{background:#7EA1C3;color:#fff}.b-I{background:#E3EAF2;color:#002A46}.b-x{background:transparent;color:#B6C0CD}
.raci-leg{display:flex;gap:1.6em;align-items:center;font-size:.8em;color:#3E4C5E}
.raci-leg span{display:flex;align-items:center;gap:.45em}.raci-leg .raci-b{width:1.6em;height:1.6em}
.fxraci.cy-active .raci-h.cy-on{color:#F78C16;border-color:#F78C16}
.fxraci.cy-active .raci-c.cy-on{background:#FFF1E3}
.fxv-accountable .raci-b.b-A{box-shadow:0 0 0 .22em rgba(247,140,22,.25)}
.am-in .fxv-cascade .raci-h{animation:amFade .5s ease var(--d,0ms) both}
.am-in .fxv-cascade .raci-t,.am-in .fxv-cascade .raci-c{animation:amLeft .5s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + var(--r) * 130ms + 150ms) both}
.am-in .fxv-cascade .raci-c .raci-b{animation:amPop .45s cubic-bezier(.34,1.56,.64,1) calc(var(--d,0ms) + var(--r) * 130ms + var(--g) * 50ms + 420ms) both}
.am-in .fxv-columns .raci-t{animation:amFade .5s ease var(--d,0ms) both}
.am-in .fxv-columns .raci-h,.am-in .fxv-columns .raci-c{animation:amRise .55s cubic-bezier(.22,.61,.36,1) calc(var(--d,0ms) + var(--g) * 280ms + 250ms) both}
.am-in .fxv-accountable .raci-h,.am-in .fxv-accountable .raci-t,.am-in .fxv-accountable .raci-c{animation:amFade .5s ease calc(var(--d,0ms) + var(--r,0) * 80ms) both}
.am-in .fxv-accountable .raci-c .raci-b.b-A{animation:amAccent 1.8s ease-in-out calc(var(--d,0ms) + 1s) infinite}
.am-in .fxv-accountable .raci-c .raci-b:not(.b-A){opacity:.5;transition:opacity .8s ease .9s}
.am-in .fxv-focus .raci-h,.am-in .fxv-focus .raci-t,.am-in .fxv-focus .raci-c{animation:amFade .5s ease calc(var(--d,0ms) + var(--r,0) * 80ms) both}
.raci-leg{animation:none}
.am-in .fxraci .raci-leg{animation:amFade .6s ease calc(var(--d,0ms) + 1.2s) both}
/* mapa de riscos */
.fxrisk{color:#002A46;overflow:visible}
.rk-plot{position:absolute;left:7%;top:2%;width:52%;height:84%}
.rk-cell{position:absolute;width:19.2%;height:19.2%;margin:.4%;border-radius:.4em}
.lv1{background:#E3EAF2}.lv2{background:#A3B8D6}.lv3{background:#F9C48A}.lv4{background:#F78C16}
.rk-bub{position:absolute;width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;background:#002A46;color:#fff;font-family:'Roboto Condensed',Roboto,sans-serif;font-weight:700;transform:translate(-50%,-50%);box-shadow:0 0 0 .18em #fff,0 .3em .8em rgba(0,30,50,.3);z-index:2}
.rk-y{position:absolute;left:0;top:44%;transform:translate(-30%,-50%) rotate(-90deg);font-family:'Roboto Condensed',Roboto,sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#43698F;white-space:nowrap}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;grid-template-rows:54px 50px minmax(0,1fr);grid-template-columns:196px minmax(0,1fr) 304px;grid-template-areas:"top top top" "rib rib rib" "side cv props";font-family:Inter,Arial,sans-serif;font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
/* topo */
#top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand b{font-family:'Roboto Condensed',sans-serif;font-weight:700;letter-spacing:.16em;font-size:13px}
.brand b i{font-style:normal;color:var(--orange)}
.brand span{font-size:12px;color:var(--steel);padding-left:12px;border-left:1px solid rgba(255,255,255,.2)}
#title{flex:0 1 340px;min-width:120px;height:32px;padding:0 10px;border-radius:7px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-weight:600}
#title:focus{outline:none;border-color:var(--orange)}
.sp{flex:1}
.tb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;border:1px solid rgba(255,255,255,.2);font-weight:600;font-size:12.5px;white-space:nowrap;transition:all .2s var(--e)}
.tb:hover{border-color:var(--orange);background:rgba(247,140,22,.12)}
.tb.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.tb.pri:hover{background:#E07A0A}
.tb svg,.rb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb.ic{width:34px;padding:0;justify-content:center}
.tb[disabled]{opacity:.35;pointer-events:none}
/* faixa de ferramentas */
#rib{grid-area:rib;display:flex;align-items:center;gap:4px;padding:0 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.rg{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line)}
.rg:last-child{border-right:0}
.rb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--navy);white-space:nowrap;transition:background .15s}
.rb:hover,.rb.open{background:#EEF2F7}
.rb.accent{background:var(--navy);color:#fff}
.rb.accent:hover,.rb.accent.open{background:#0B3A63}
.rb.accent svg{stroke:var(--orange)}
.rb .car{width:10px;height:10px;stroke-width:2.5;opacity:.6}
.rb[disabled]{opacity:.35;pointer-events:none}
.menu{position:fixed;z-index:40;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,30,50,.18);padding:6px;display:none}
.menu.open{display:block;animation:pop .16s var(--e)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500}
.menu button:hover{background:#EEF2F7}
.menu button small{margin-left:auto;color:var(--mut);font-size:11px}
.menu .mh{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 10px 4px}
.menu .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.menu .grid button{flex-direction:column;gap:4px;padding:8px 4px;font-size:11px;text-align:center}
.menu .grid svg{width:42px;height:28px}
.mi-sw{width:26px;height:16px;border-radius:4px;border:1px solid var(--line);flex:none}
/* lateral de slides */
#side{grid-area:side;background:#F4F6F9;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#thumbs{flex:1;overflow:auto;padding:12px 12px 4px}
.th{position:relative;display:grid;grid-template-columns:18px 1fr;gap:6px;margin-bottom:10px;cursor:pointer}
.th .n{font-size:11px;font-weight:600;color:var(--mut);padding-top:2px;text-align:right}
.th .box{position:relative;border-radius:6px;overflow:hidden;outline:2px solid transparent;outline-offset:1px;box-shadow:0 1px 3px rgba(0,30,50,.15);transition:outline-color .15s}
.th .box .am-stage{pointer-events:none}
.th.on .box{outline-color:var(--orange)}
.th:hover .box{outline-color:#C5D2E2}
.th.on:hover .box{outline-color:var(--orange)}
.th .act{position:absolute;right:4px;top:4px;display:none;gap:3px;z-index:3}
.th:hover .act{display:flex}
.th .act button{width:22px;height:22px;border-radius:6px;background:rgba(0,30,50,.75);color:#fff;font-size:12px;line-height:22px;text-align:center}
.th .act button:hover{background:var(--orange)}
.th.drop-before .box{box-shadow:0 -3px 0 var(--orange)}
#addSlide{margin:6px 12px 12px;height:38px;border-radius:9px;border:1.5px dashed #B8C6D8;color:var(--navy);font-weight:600}
#addSlide:hover{border-color:var(--orange);color:var(--orange);background:#fff}
/* canvas */
#cv{grid-area:cv;position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden}
#wrap{position:relative;box-shadow:0 10px 40px rgba(0,30,50,.18)}
#wrap>.am-stage{width:100%;height:100%;aspect-ratio:auto}
.am-edit .am-el{cursor:move}
.am-edit .am-el.editing{cursor:text}
.am-edit .am-el.editing .am-tx{outline:none;cursor:text;user-select:text}
.am-edit{user-select:none}
#sel{position:absolute;inset:0;pointer-events:none;z-index:30}
.sbox{position:absolute;outline:1.5px solid var(--orange);outline-offset:0}
.sbox.edit{outline-style:dashed}
.hdl{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:1.5px solid var(--orange);border-radius:2px;pointer-events:auto}
.hdl.p{border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px}
.guide{position:absolute;background:#F78C16;opacity:.85}
.guide.v{width:1px;top:0;bottom:0}.guide.h{height:1px;left:0;right:0}
.hover-box{position:absolute;outline:1px solid rgba(126,161,195,.9)}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:11.5px;color:var(--mut);white-space:nowrap;pointer-events:none}
#hint b{color:var(--navy)}
#drophint{position:absolute;inset:0;border:2px dashed var(--orange);border-radius:6px;background:rgba(247,140,22,.06);display:none;pointer-events:none;z-index:31}
#wrap.dragover #drophint{display:block}
/* propriedades */
#props{grid-area:props;background:#fff;border-left:1px solid var(--line);overflow:auto;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.ph h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.ph h2 small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:2px}
.ph .ib{display:flex;gap:2px}
.ib button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--navy)}
.ib button:hover{background:#EEF2F7}
.ib button.del:hover{background:#FDE8DC;color:#C2410C}
.ib svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sec{padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.row.r4{grid-template-columns:repeat(4,1fr)}
.row.r3{grid-template-columns:repeat(3,1fr)}
.row.r1{grid-template-columns:1fr}
.pf{display:flex;flex-direction:column;gap:4px;min-width:0}
.pf>span{font-size:11px;font-weight:600;color:var(--mut)}
.pf input[type=number],.pf input[type=text],.pf select,.pf textarea{width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#F8FAFC;font-size:12.5px}
.pf textarea{height:auto;min-height:74px;padding:6px 8px;resize:vertical;line-height:1.4}
.pf input:focus,.pf select:focus,.pf textarea:focus{outline:none;border-color:var(--orange);background:#fff}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw button{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,30,50,.18);position:relative}
.sw button.on{outline:2px solid var(--orange);outline-offset:1px}
.sw button.none{background:linear-gradient(135deg,#fff 45%,#E0523A 45%,#E0523A 55%,#fff 55%)}
.sw input[type=color]{width:24px;height:22px;padding:0;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#F8FAFC}
.seg button{flex:1;height:28px;font-size:12px;font-weight:600;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--navy);background:#fff}
.chip:hover{border-color:var(--orange)}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.btnw{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);font-weight:600;color:var(--navy);background:#F8FAFC}
.btnw:hover{border-color:var(--orange)}
.btnw.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{font-size:11.5px;color:var(--mut);line-height:1.5;margin:6px 0 0}
.empty{padding:22px 16px;color:var(--mut);line-height:1.6}
.empty b{color:var(--navy)}
/* gaveta de efeitos */
#drawer{position:fixed;top:104px;right:0;bottom:0;width:min(560px,92vw);background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,30,50,.18);z-index:35;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s var(--e)}
#drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:15px}
.dh h2 small{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:3px}
.db{flex:1;overflow:auto;padding:6px 18px 24px}
.dcat{margin:16px 0 10px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fxi{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:grab;transition:transform .2s var(--e),box-shadow .2s,border-color .2s}
.fxi:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,30,50,.12);border-color:#C5D2E2}
.fxi .pv{position:relative;aspect-ratio:16/9;pointer-events:none}
.fxi .pv .am-stage{position:absolute;inset:0;width:100%;height:100%}
.fxi .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px}
.fxi .ft b{font-size:12.5px}
.fxi .ft button{height:26px;padding:0 10px;border-radius:7px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600}
.fxi .ft button:hover{background:var(--orange)}
.anims{display:flex;flex-wrap:wrap;gap:6px}
.dtabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line)}
.dtabs button{height:36px;padding:0 14px;border-radius:8px 8px 0 0;font-weight:700;font-size:12.5px;color:var(--mut);border-bottom:2px solid transparent}
.dtabs button.on{color:var(--navy);border-bottom-color:var(--orange)}
.dsearch{padding:12px 18px 0}
.dsearch input{width:100%;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#F8FAFC;font-size:13px}
.dsearch input:focus{outline:none;border-color:var(--orange);background:#fff}
.fxi .vl{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 10px}
.fxi .vl span{font-size:10.5px;font-weight:600;color:var(--navy);background:#EEF2F7;border-radius:99px;padding:3px 8px}
.fxi .ft small{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:2px}
.fxarrow{position:absolute;transform:translateY(calc(-100% - 8px));display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 9px;border-radius:8px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:auto;box-shadow:0 6px 16px rgba(0,30,50,.25);cursor:pointer;z-index:2}
.fxarrow:hover{background:#0B3A63}
.fxarrow b{color:var(--orange);font-weight:700}
.fxarrow svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.5}
.vmenu{width:340px;padding:8px}
.vmenu .vh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.vmenu .vh b{font-size:12.5px}
.vmenu .vh button{width:auto;height:28px;padding:0 10px;border-radius:7px;background:var(--orange);color:#fff;font-weight:700;font-size:12px;display:inline-flex}
.vmenu .vo{display:grid!important;grid-template-columns:18px 1fr;gap:2px 8px;align-items:start;padding:9px 10px!important}
.vmenu .vo i{grid-row:span 2;width:14px;height:14px;margin-top:2px;border-radius:50%;border:2px solid #B8C6D8}
.vmenu .vo.on i{border-color:var(--orange);background:radial-gradient(circle,var(--orange) 45%,transparent 50%)}
.vmenu .vo b{font-size:12.5px}
.vmenu .vo span{font-size:11.5px;color:var(--mut);line-height:1.4}
.vtip{margin:8px 0 0;padding:9px 10px;border-radius:8px;background:#FFF6EE;color:#8A4B0F;font-size:11.5px;line-height:1.45}
.prevov{position:absolute;inset:0;z-index:25;pointer-events:none;background:transparent}
.prevov .am-stage{width:100%;height:100%;aspect-ratio:auto;background:transparent!important}
.am-el.previewing{visibility:hidden}
.am-edit [data-e]:hover{outline:1px dashed rgba(247,140,22,.7);outline-offset:1px}
.am-edit [data-cyc]{cursor:pointer}
.am-el.editing [data-e][contenteditable]{outline:2px solid var(--orange);outline-offset:2px;background:rgba(255,255,255,.85);color:#002A46;cursor:text;user-select:text}
/* banner / toast */
#banner{position:fixed;left:50%;top:116px;transform:translateX(-50%);z-index:45;display:none;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:12px;background:var(--navy);color:#fff;box-shadow:0 16px 40px rgba(0,30,50,.3);font-weight:500}
#banner.open{display:flex;animation:pop .2s var(--e)}
#banner button{height:30px;padding:0 12px;border-radius:7px;border:1px solid rgba(255,255,255,.25);font-weight:600}
#banner button.pri{background:var(--orange);border-color:var(--orange)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:10px 16px;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;transition:all .3s var(--e);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#presenter{position:fixed;inset:0;z-index:80;display:none}
#presenter.open{display:block}
.hidden{display:none!important}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><b>ALVAREZ <i>&amp;</i> MARSAL</b><span>Studio de Apresentações</span></div>
  <input id="title" value="Nova apresentação" aria-label="Nome da apresentação" spellcheck="false">
  <button class="tb ic" id="bUndo" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="tb ic" id="bRedo" title="Refazer (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <div class="sp"></div>
  <button class="tb" id="bNew" title="Começar uma apresentação em branco"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg>Novo</button>
  <button class="tb" id="bOpen" title="Abrir uma apresentação salva (.html)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Abrir</button>
  <button class="tb" id="bPlay" title="Apresentar desde o início"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Apresentar</button>
  <button class="tb pri" id="bSave" title="Gera um novo arquivo .html com a apresentação (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Salvar apresentação</button>
  <input type="file" id="fOpen" accept=".html,.htm,.json" class="hidden">
  <input type="file" id="fImg" accept="image/*" class="hidden">
  <input type="file" id="fBg" accept="image/*" class="hidden">
</header>

<nav id="rib" aria-label="Ferramentas">
  <div class="rg">
    <button class="rb" data-menu="mText"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Texto<svg class="car" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="rb" data-menu="mShape"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="10" height="10" rx="1"/><circle cx="16" cy="16" r="5"/></svg>Formas<svg class="car" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="rb" data-add="line"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg>Linha</button>
    <button class="rb" data-add="arrow"><svg viewBox="0 0 24 24"><path d="M4 20L19 5M10 5h9v9"/></svg>Seta</button>
    <button class="rb" data-add="image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Imagem</button>
    <button class="rb" data-menu="mCard"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h10M7 14h6"/></svg>Cards<svg class="car" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="rb" data-menu="mBrand"><svg viewBox="0 0 24 24"><path d="M5 20L12 4l7 16M12 4v16"/></svg>Marca A&amp;M<svg class="car" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div class="rg">
    <button class="rb accent" id="bModels" title="Biblioteca de modelos: RACI, mapa de riscos, SWOT, matrizes, gráficos, termômetro, timeline…"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7M17.5 14v7"/></svg>Modelos</button>
    <button class="rb accent" id="bFx"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Acervo de efeitos</button>
  </div>
  <div class="rg">
    <button class="rb" id="bFront" title="Trazer para frente"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M4 16V4h12"/></svg>Frente</button>
    <button class="rb" id="bBack" title="Enviar para trás"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="1"/><path d="M20 8v12H8"/></svg>Trás</button>
    <button class="rb" id="bDup" title="Duplicar (Ctrl+D)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Duplicar</button>
    <button class="rb" id="bDel" title="Excluir (Delete)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Excluir</button>
  </div>
  <div class="rg">
    <button class="rb" id="bPreview" title="Ver este slide com as animações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>Prévia do slide</button>
  </div>
</nav>

<div class="menu" id="mText">
  <button data-text="title"><b style="font-family:Roboto;font-weight:300;font-size:18px">Título</b><small>Roboto Light</small></button>
  <button data-text="subtitle"><b style="font-family:'Roboto Condensed';color:#F78C16">Subtítulo em destaque</b></button>

    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Apresentação salva: ' + name);
  }
  function openFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var txt = String(r.result), d = null;
      try {
        if (/am-deck-data/.test(txt)) { var doc = new DOMParser().parseFromString(txt, 'text/html'), sc = doc.getElementById('am-deck-data'); d = JSON.parse(sc.textContent); }
        else d = JSON.parse(txt);
      } catch (err) { d = null; }
      loadDeck(d, 'Apresentação aberta: ' + file.name);
    };
    r.readAsText(file);
  }
  $('#bSave').addEventListener('click', save);
  $('#bPlay').addEventListener('click', function () { present(0); });
  $('#bPreview').addEventListener('click', function () { present(cur); });
  $('#bOpen').addEventListener('click', function () { var f = $('#fOpen'); f.value = ''; f.click(); });
  $('#fOpen').addEventListener('change', function () { if (this.files[0]) openFile(this.files[0]); });
  $('#bNew').addEventListener('click', function () { if (deck.slides.some(function (s) { return s.els.length; }) && !confirm('Começar uma apresentação em branco? O que não foi salvo será perdido.')) return; loadDeck(newDeck(), 'Nova apresentação em branco'); try { localStorage.removeItem('amStudio.draft'); } catch (e) { } });
  $('#bUndo').addEventListener('click', undo); $('#bRedo').addEventListener('click', redo);
  $('#bFront').addEventListener('click', function () { act('front'); }); $('#bBack').addEventListener('click', function () { act('back'); });
  $('#bDup').addEventListener('click', dupSel); $('#bDel').addEventListener('click', delSel);
  $('#title').addEventListener('input', function () { deck.title = this.value; });
  $('#title').addEventListener('change', commit);
  $('#fBg').addEventListener('change', function () { });
  addEventListener('resize', function () { fit(); drawSel(); });
  addEventListener('beforeunload', function (e) { if (hist.length) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------------- início ---------------- */
  buildModels(); buildDrawer(); renderAll(); updUndo();
  try {
    var dr = localStorage.getItem('amStudio.draft'), dd = dr && JSON.parse(dr);
    if (dd && dd.slides && dd.slides.some(function (s) { return s.els && s.els.length; })) {
      $('#banner').classList.add('open');
      $('#bDraftYes').onclick = function () { $('#banner').classList.remove('open'); loadDeck(dd, 'Rascunho recuperado'); };
      $('#bDraftNo').onclick = function () { $('#banner').classList.remove('open'); try { localStorage.removeItem('amStudio.draft'); } catch (e) { } };
    }
  } catch (e) { }
  window.AMStudio = { get deck() { return deck; }, exportHTML: exportHTML, present: present, goSlide: goSlide, insertFx: insertFx, addSlide: addSlide, select: select, setVariant: function (v) { setVariant(sel(), v); }, previewEl: function () { previewEl(sel()); } };
})();

</script>
